<style>
/* Layout: iOS-style app. Large title header per tab, inset grouped lists, widget cards, floating glass tab bar;
   desktop = translucent sidebar + two-column board. Keeps the sheet's DNA: navy, week colours, neon squares, XP and levels.
   Type: SF Pro on Apple devices (system font), rounded numerals (SF Pro Rounded, Nunito elsewhere). */
:root{
  /* Dark Theme: Premium obsidian/charcoal with refined Indigo & Emerald accents (no fluorescent neon green) */
  --bg:#0D0F14;
  --grouped:#161922;
  --grouped-2:#1D212D;
  --elev:#242938;
  --sheet-bg:#161922;
  --seg-sel:#2D3344;
  --rail-bg:rgba(13,15,20,.88);
  --tabbar-bg:linear-gradient(180deg,rgba(29,33,45,.75),rgba(16,19,26,.90));
  --tabbar-shadow:0 24px 50px -18px rgba(0,0,0,.7);
  --glow-1:rgba(99,102,241,.06);
  --glow-2:rgba(16,185,129,.04);
  --plate-bg:linear-gradient(180deg,rgba(99,102,241,.05),rgba(99,102,241,.01)),#161922;
  --plate-border:rgba(99,102,241,.24);
  --plate-glow:rgba(99,102,241,.12);
  --plate-wk-bg:linear-gradient(180deg,rgba(139,92,246,.05),rgba(139,92,246,.01)),#161922;
  --plate-wk-border:rgba(139,92,246,.25);
  --plate-wk-glow:rgba(236,72,153,.12);
  --plate-mn-border:rgba(16,185,129,.25);
  --plate-mn-glow:rgba(16,185,129,.12);
  --card-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.06);
  --sheet-shadow:0 -12px 40px rgba(0,0,0,.5);
  --label:#F2F4F8;
  --label-2:rgba(235,238,245,.65);
  --label-3:rgba(235,238,245,.35);
  --label-4:rgba(235,238,245,.14);
  --sep:rgba(255,255,255,.08);
  --fill:rgba(255,255,255,.06);
  --on:#FFFFFF;
  --accent:#6366F1;
  --red:#F43F5E;
  --violet:#8B5CF6;
  --blue:#3B82F6;
  --cyan:#06B6D4;
  --mint:#10B981;
  --green:#22C55E;
  --yellow:#F59E0B;
  --pink:#EC4899;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Manrope",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --r:24px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
[data-theme="light"]{
  /* Light Theme: Modern, crisp Apple-grade neutral studio aesthetic (never beige or muddy) */
  --bg:#F3F4F6; --grouped:#FFFFFF; --grouped-2:#EAECEF; --elev:#DFE2E6;
  --sheet-bg:#FFFFFF; --seg-sel:#D5D8DE; --rail-bg:rgba(255,255,255,.85);
  --tabbar-bg:linear-gradient(180deg,rgba(255,255,255,.94),rgba(245,247,250,.96));
  --tabbar-shadow:0 12px 30px -8px rgba(0,0,0,.12);
  --glow-1:rgba(120,90,250,.07); --glow-2:rgba(20,185,155,.07);
  --plate-bg:linear-gradient(180deg,rgba(14,165,140,.06),rgba(14,165,140,.01)),#FFFFFF;
  --plate-border:rgba(14,165,140,.28); --plate-glow:rgba(14,165,140,.18);
  --plate-wk-bg:linear-gradient(180deg,rgba(110,75,245,.06),rgba(110,75,245,.01)),#FFFFFF;
  --plate-wk-border:rgba(110,75,245,.28); --plate-wk-glow:rgba(230,60,140,.18);
  --plate-mn-border:rgba(60,165,30,.28); --plate-mn-glow:rgba(60,165,30,.18);
  --card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px -2px rgba(0,0,0,.04);
  --sheet-shadow:0 -12px 40px rgba(0,0,0,.15);
  --label:#111422; --label-2:rgba(25,30,50,.65); --label-3:rgba(25,30,50,.38); --label-4:rgba(25,30,50,.14);
  --sep:rgba(0,0,0,.08); --fill:rgba(0,0,0,.05); --on:#FFFFFF; --accent:#0EA58C; --red:#EF4444;
  --violet:#6E4BF5; --blue:#2563EB; --cyan:#0891B2; --mint:#0EA58C; --green:#3CA51E; --yellow:#D97706; --pink:#E11D74;
  color-scheme:light;
}
[data-theme="light"] .tabbar{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 1px rgba(0,0,0,.08),var(--tabbar-shadow)}
[data-theme="light"] .card, [data-theme="light"] .list{box-shadow:var(--card-shadow)}
[data-theme="light"] .sheet{box-shadow:var(--sheet-shadow)}
[data-theme="light"] .plate{background:var(--plate-bg);box-shadow:inset 0 0 0 1.5px var(--plate-border),0 8px 24px -10px var(--plate-glow)}
[data-theme="light"] .plate.wk{background:var(--plate-wk-bg);box-shadow:inset 0 0 0 1.5px var(--plate-wk-border),0 8px 24px -10px var(--plate-wk-glow)}
[data-theme="light"] .plate.mn{box-shadow:inset 0 0 0 1.5px var(--plate-mn-border),0 8px 24px -10px var(--plate-mn-glow)}
[data-theme="light"] .sw.sel{box-shadow:0 0 0 3px var(--sheet-bg),0 0 0 5px var(--c)}
[data-theme="light"] .ru-card, [data-theme="light"] .keep-card{background:var(--sheet-bg);box-shadow:0 14px 40px rgba(0,0,0,.14)}
[data-theme="light"] .theme-toggle{background:var(--fill);color:var(--label)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 480px at 15% -12%,var(--glow-1),transparent 62%),radial-gradient(800px 460px at 100% -8%,var(--glow-2),transparent 62%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;letter-spacing:inherit}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{touch-action:manipulation}
h1,h2,h3{text-wrap:balance;margin:0}
.r{font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.l2{color:var(--label-2)} .l3{color:var(--label-3)}

.app{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(118px + env(safe-area-inset-bottom,0px))}
.main{width:100%;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.rail{display:none}

/* header: iOS large title */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding-top:18px}
.top .cap{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em}
.large{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-top:2px}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.me{border-radius:50%;transition:transform .3s var(--spring)}
.me:active{transform:scale(.92)}
.me .ring-label b{font-family:var(--round);font-size:16px;font-weight:800}
.pillbtn{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--label)}
.pillbtn svg{width:16px;height:16px}
.pillbtn:disabled{opacity:.3;cursor:default}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 16px;border-radius:99px;background:var(--grouped);font-size:13px;color:var(--label-2)}

/* surfaces */
.card{position:relative;background:var(--grouped);border-radius:var(--r);padding:18px;min-width:0;box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 16px 8px;font-size:13px;font-weight:400;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em}
.g-head a,.g-head button{text-transform:none;letter-spacing:-.01em;font-size:15px;font-weight:500;color:var(--accent)}
.list{background:var(--grouped);border-radius:var(--r);overflow:hidden;box-shadow:inset 0 .5px 0 rgba(255,255,255,.07)}
.li{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;min-height:62px}
.li+.li::before{content:"";position:absolute;top:0;right:0;left:66px;height:.5px;background:var(--sep)}
.li-main{min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.li-t{font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label-2);white-space:nowrap;overflow:hidden}
.li-s svg{width:12px;height:12px;flex:none}
.li-s .fl{color:var(--yellow)}
.li-s .dot{color:var(--label-3)}
.li.rest{opacity:.55}
.li.add{grid-template-columns:36px 1fr;color:var(--accent);font-size:17px;min-height:54px;text-align:left;width:100%}
.li.add .plus{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,transparent)}
.li.add .plus svg{width:16px;height:16px}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;background:color-mix(in srgb,var(--p) 22%,var(--grouped-2))}
.btn{background:var(--accent);color:var(--on);font-weight:600;font-size:17px;padding:14px 22px;border-radius:99px;transition:transform .3s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:default}
.btn-big{width:100%}
.btn-tint{background:var(--fill);color:var(--accent);font-weight:600;font-size:15px;padding:8px 16px;border-radius:99px;white-space:nowrap}
.pro-chip{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--on);background:var(--yellow);border-radius:99px;padding:2px 6px;line-height:1.3}
.ico{display:grid;place-items:center;flex:none;border-radius:50%;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.ico svg{width:56%;height:56%}

/* rings */
.ring-wrap{position:relative;display:grid;place-items:center;flex:none}
.ring-wrap svg,.rings{overflow:visible;display:block}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05}
.ring-label b{font-family:var(--round);font-weight:800;font-variant-numeric:tabular-nums}
.ring-label small{font-size:11px;color:var(--label-2);font-weight:600;margin-top:2px}
.ring-prog{animation:ringin 1.1s var(--ease) both}
@keyframes ringin{from{stroke-dashoffset:var(--from)}to{stroke-dashoffset:var(--to)}}

/* the sheet's square checkbox, made tactile */
.cb{--s:24px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .3);display:grid;place-items:center;flex:none;color:transparent;background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 42%,var(--label-4));transition:transform .35s var(--spring),box-shadow .25s,background .25s}
.cb svg{width:62%;height:62%}
.cb:active{transform:scale(.85)}
.cb.on{color:var(--on);background:var(--c);box-shadow:0 0 10px -3px var(--c)}
.cb:disabled{opacity:.25;cursor:default}
.cb.extra{opacity:.55}
.cb.xl{--s:32px}
.pop{animation:pop .55s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* Today */
.today-view{display:grid;gap:22px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.activity{display:flex;align-items:center;justify-content:center;gap:clamp(22px,6vw,56px)}
.legend-a{display:flex;flex-direction:column;gap:14px;min-width:0}
.leg .t{font-size:15px;font-weight:600;color:var(--label)}
.leg b{display:block;font-family:var(--round);font-size:26px;font-weight:800;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums}
.leg b small{font-size:17px;font-weight:700}
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.w{display:flex;flex-direction:column;gap:6px;padding:16px;min-height:132px}
.w-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--label)}
.w-h .ico{width:26px;height:26px}
.w-big{font-family:var(--round);font-size:34px;font-weight:800;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums}
.w-big small{font-size:15px;font-weight:700;color:var(--label-2);margin-left:3px}
.w-s{font-size:13px;color:var(--label-2)}
.w-row{display:flex;align-items:center;gap:12px;margin-top:auto}
.w-row .ring-label b{font-size:13px}
.minibars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;align-items:end;height:48px;margin-top:auto}
.minibars i{display:block;border-radius:99px;background:var(--c);min-height:6px}
.minibars i.future{background:var(--fill);box-shadow:none;height:6px}
.minibars i.now{box-shadow:0 0 0 2px var(--grouped),0 0 0 3.5px var(--label-2)}
.b3{grid-template-columns:22px minmax(0,1fr) auto}
.b3 .star{color:var(--c);display:grid;place-items:center}
.b3 .star svg{width:15px;height:15px}
.b3.done .li-t{color:var(--label-3);text-decoration:line-through;text-decoration-color:var(--c)}
.mind{display:block;padding:14px 16px}
.mind-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.mind-top span{font-size:17px;font-weight:500}
.mind-top b{font-family:var(--round);font-size:20px;font-weight:800;color:var(--c)}
.slider{position:relative;height:30px;border-radius:99px;background:var(--fill);overflow:hidden}
.slider i{position:absolute;left:0;top:0;bottom:0;width:var(--v);border-radius:99px;background:var(--c);transition:width .45s var(--spring)}
.slider .hits{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr))}
.slider .hits button{height:100%}

/* Month: the sheet */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid-card{padding:18px 0 16px 16px}
.grid-wrap{overflow-x:auto;padding-right:16px;scrollbar-width:none}
.grid-wrap::-webkit-scrollbar{display:none}
.mgrid{display:grid;grid-template-columns:var(--lab) repeat(var(--n),var(--cell));column-gap:4px;width:max-content;--lab:190px;--cell:28px}
.mlab{position:sticky;left:0;z-index:2;background:var(--grouped);display:flex;align-items:center;gap:10px;height:36px;padding-right:10px;min-width:0;text-align:left;font-size:15px;font-weight:500}
.mlab .tile{width:26px;height:26px;border-radius:8px;font-size:13px}
.mlab .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bandp{height:24px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);margin-bottom:8px}
.dh{height:20px;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--label-3)}
.dn{height:26px;display:grid;place-items:center;font-family:var(--round);font-size:13px;font-weight:700;color:var(--label-2);font-variant-numeric:tabular-nums}
.dn.now span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on)}
.mcell{height:36px;display:grid;place-items:center}
.mcell .cb{--s:22px}
.tcol{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tcol.ts{border-radius:12px 12px 0 0}
.tcol.te{border-radius:0 0 12px 12px}
.mrest{width:22px;height:22px;display:grid;place-items:center;border-radius:7px}
.mrest::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--label-4)}
.mrest:disabled{cursor:default}
@media (max-width:600px){.mgrid{--lab:44px;--cell:26px}.mlab .t{display:none}}
.an .li{grid-template-columns:minmax(0,1fr) auto;padding-block:12px}
.an .li+.li::before{left:16px}
.an .li-t{display:flex;align-items:center;gap:8px;font-size:16px}
.an .li-t i{width:9px;height:9px;border-radius:50%;background:var(--p);flex:none}
.an .pct{font-family:var(--round);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.thin{height:4px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:8px}
.thin i{display:block;height:100%;border-radius:99px;background:var(--p)}
.chip-s{font-size:11px;font-weight:600;color:var(--label-2);padding:2px 8px;border-radius:99px;background:var(--fill);white-space:nowrap}
.bars{position:relative;height:150px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;align-items:end}
.bars i{display:block;border-radius:99px;min-height:6px;background:var(--c)}
.bars i.future{background:var(--fill);box-shadow:none;height:6px}
.bars i.rest{background:var(--fill);box-shadow:none}
.bars i.now{box-shadow:0 0 0 2px var(--grouped),0 0 0 3.5px var(--label-2)}
.avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--label-3);pointer-events:none}
.avg span{position:absolute;right:0;top:-26px;font-size:11px;font-weight:600;color:var(--label-2);background:var(--elev);padding:3px 8px;border-radius:99px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--label-3);margin-top:8px;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--label-3);font-size:10px;font-family:var(--font);font-weight:500}
.trio{display:grid;gap:12px}
.rank{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:7px;font-size:15px}
.rank+.rank{border-top:.5px solid var(--sep)}
.rank .i{color:var(--label-3);font-weight:600;font-size:13px}
.rank .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .v{font-family:var(--round);font-weight:800;color:var(--accent)}
.weak .rank .v{color:var(--pink)}
.ins b{display:block;font-family:var(--round);font-size:30px;font-weight:800;line-height:1.1}
.ins .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-block:6px}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--label-2);padding:5px 10px;border-radius:99px;background:var(--fill)}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.card-h .s{font-size:13px;color:var(--label-2)}

/* Week planner */
.boss{background:var(--grouped)}
.boss-top{display:flex;align-items:center;gap:12px}
.boss-top .ico{width:36px;height:36px}
.boss-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:14px;align-items:center;margin-top:14px}
.boss-row input{background:transparent;border:0;border-bottom:.5px solid var(--sep);padding:8px 0;font-size:22px;font-weight:600;letter-spacing:-.02em;min-width:0;width:100%}
.boss-row input::placeholder{color:var(--label-3)}

.trow .cb{--s:22px}
.dfoot{margin-top:auto;padding-top:12px;text-align:center;font-size:13px;color:var(--label-2)}

.notes{display:grid;gap:12px}
.notes textarea{width:100%;min-height:96px;background:transparent;border:0;resize:none;font-size:16px;line-height:1.6;margin-top:6px}

/* Year */
.yr .li{grid-template-columns:96px minmax(0,1fr) auto}

/* Money: the month's budget next to the habits */
.money-view{display:grid;gap:22px}

.mhero{display:flex;align-items:center;justify-content:center;gap:clamp(22px,6vw,56px)}
.mbtns{display:flex;gap:10px;flex-wrap:wrap}
.mbtns .btn{flex:1;padding:12px 18px;font-size:16px}
.mbtns .btn-tint{display:inline-flex;align-items:center;justify-content:center;gap:6px}

.btn-tint.ns.on{background:color-mix(in srgb,var(--yellow) 20%,transparent);color:var(--yellow)}
.mchart .bars{height:130px;margin-top:16px}
.bars i.over{background:linear-gradient(var(--pink),var(--c) 70%)}

.mchart .avg span{top:-24px}
.mcat .thin{height:8px}
.mcat .thin i{box-shadow:0 0 12px -3px var(--p)}
.mcat.over .thin i{background:var(--pink);box-shadow:0 0 12px -3px var(--pink)}
.mv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.mv b{font-family:var(--round);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.mv small{font-size:12px;color:var(--label-2)}
.mcat.over .mv b{color:var(--pink)}
.mtx{width:100%;text-align:left}
.amt-r{font-family:var(--round);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.mplan{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:6px 12px;padding:10px 16px 0;font-size:13px;color:var(--label-2)}
@media (max-width:600px){.mplan{grid-template-columns:repeat(2,auto)}}

.msetup{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.msetup h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.msetup p{margin:0;color:var(--label-2)}
.plate.mn{box-shadow:inset 0 0 0 1.5px rgba(155,229,100,.45),0 0 34px -14px rgba(155,229,100,.6);background:linear-gradient(180deg,rgba(155,229,100,.08),rgba(155,229,100,.02)),var(--grouped)}
.plate.mn .kx .kl{color:var(--green)}
.kv.gr{color:var(--green);text-shadow:0 0 18px rgba(155,229,100,.45)}
.kv.neg{color:var(--pink);text-shadow:none}
.xb.mnb i{background:linear-gradient(90deg,var(--green),var(--yellow));box-shadow:0 0 14px rgba(155,229,100,.6)}
.xb.mnb.over i{background:var(--pink);box-shadow:0 0 14px rgba(255,116,184,.6)}
.mtoday{display:flex;flex-direction:column;gap:12px}
.mt-link{margin-left:auto;color:var(--accent);font-size:15px;font-weight:500}
.mt-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.mt-big{display:block;font-family:var(--round);font-size:34px;font-weight:900;line-height:1.05;color:var(--green);text-shadow:0 0 18px rgba(155,229,100,.4);font-variant-numeric:tabular-nums}
.mt-big.neg{color:var(--pink);text-shadow:none}
.mt-today{text-align:right;flex:none}
.mt-today b{display:block;font-family:var(--round);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.amt-box{display:flex;align-items:center;justify-content:center;gap:2px;padding:6px 0 0}
.amt-box span{font-family:var(--round);font-size:40px;font-weight:800;color:var(--label-2)}
.amt-box input{min-width:1.6ch;max-width:80%;background:transparent;border:0;font-family:var(--round);font-size:56px;font-weight:900;text-align:left;font-variant-numeric:tabular-nums}
.amt-box input:focus{outline:none}
.amt-box input::placeholder{color:var(--label-4)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.catb{display:flex;align-items:center;gap:7px;padding:10px 12px;border-radius:14px;background:var(--grouped);font-size:14px;text-align:left;white-space:nowrap;overflow:hidden}
.catb.sel{background:color-mix(in srgb,var(--c) 22%,var(--grouped));box-shadow:inset 0 0 0 1.5px var(--c)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:.5px solid var(--sep);font-size:17px}
.drow input{background:transparent;border:0;color:var(--accent);font-size:16px;text-align:right;min-width:0}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto 96px 30px;gap:6px;align-items:center}
.prow.cat{grid-template-columns:38px minmax(0,1fr) auto 96px 30px}
.prow.one{grid-template-columns:auto minmax(0,1fr)}
.prow input{min-width:0;width:100%;background:var(--grouped-2);border:0;border-radius:10px;padding:10px 12px;font-size:16px}
.prow input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.prow input::placeholder{color:var(--label-3)}
.prow .pa{text-align:right;font-family:var(--round);font-weight:700;font-variant-numeric:tabular-nums}
.pdol{color:var(--label-2);font-weight:600}
.pdel{width:30px;height:30px;border-radius:50%;color:var(--label-3);font-size:22px;line-height:1}
.pemo{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--c) 22%,var(--grouped-2));font-size:18px}
.padd{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:15px;font-weight:500;padding:6px 2px;align-self:flex-start}

/* Locked */
.locked-view{position:relative;min-height:560px}
.locked-preview{filter:blur(10px) saturate(.9);opacity:.4;pointer-events:none;max-height:720px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.locked-cta{position:absolute;left:0;right:0;top:56px;margin-inline:auto;width:min(420px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 24px;background:rgba(18,21,40,.86);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.1),0 30px 70px -30px #000}
.locked-cta h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.locked-cta p{margin:0;color:var(--label-2)}

/* Tab bar: liquid glass */
.tabbar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;margin-inline:auto;width:min(420px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:5px;border-radius:32px;background:linear-gradient(180deg,rgba(44,48,80,.52),rgba(18,20,38,.62));-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.28),inset 0 -.5px 0 rgba(255,255,255,.06),0 0 0 .5px rgba(255,255,255,.1),0 24px 50px -18px #000}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--label-2);padding:7px 0 5px;position:relative;border-radius:26px;transition:color .25s,background .35s var(--ease)}
.nav-item svg{width:24px;height:24px}
.nav-item.active{color:var(--accent);background:rgba(255,255,255,.1);box-shadow:inset 0 .5px 0 rgba(255,255,255,.18)}
.tabbar .pro-chip{position:absolute;top:2px;left:calc(50% + 8px)}
.mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#0B0E20;box-shadow:inset 0 .5px 0 rgba(255,255,255,.18)}
.mark svg{width:26px;height:26px}

/* Sheets: iOS modal */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:relative;width:min(560px,100%);max-height:94%;overflow:auto;background:var(--sheet-bg);border-radius:34px 34px 0 0;padding-top:8px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .45s var(--ease);box-shadow:inset 0 .5px 0 rgba(255,255,255,.12)}
.grabber{width:36px;height:5px;border-radius:99px;background:var(--label-4);margin:2px auto 8px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px 4px 16px}
.nav h2{font-size:17px;font-weight:600;text-align:center}
.nav .l{justify-self:start;color:var(--accent);font-size:17px}
.nav .r{justify-self:end;color:var(--accent);font-size:17px;font-weight:600}
.nav .r:disabled{color:var(--label-3);cursor:default}
.form{display:flex;flex-direction:column;gap:22px}
.inp{width:100%;background:transparent;border:0;padding:15px 16px;font-size:17px}
.inp:focus{outline:none}
.inp::placeholder{color:var(--label-3)}
.pad{padding:14px 16px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.emo{height:42px;border-radius:12px;font-size:21px;transition:background .2s}
.emo.sel{background:var(--fill);box-shadow:inset 0 0 0 1.5px var(--accent)}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 55%)}
.sw.sel{box-shadow:0 0 0 3px #0C0F1F,0 0 0 5px var(--c)}
.segc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:2px;border-radius:10px;background:var(--fill)}
.segc button{padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--label)}
.segc button.sel{background:var(--seg-sel);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.dow{aspect-ratio:1;max-height:44px;border-radius:50%;background:var(--fill);font-weight:600;font-size:13px}
.nchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.nchip{padding:8px 13px;border-radius:99px;background:var(--fill);font-weight:600;font-size:13px}
.dow.sel,.nchip.sel{background:var(--accent);color:var(--on)}
.hint{font-size:13px;color:var(--label-2);margin:10px 2px 0}
.del{width:100%;text-align:center;color:var(--red);font-size:17px;padding:15px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.preset{display:flex;gap:9px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--grouped);text-align:left;font-size:15px;transition:box-shadow .2s}
.preset[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pay{display:flex;flex-direction:column;gap:20px;padding:0 4px}
.pay-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.pay-hero h2{font-size:30px;font-weight:700;letter-spacing:-.025em;margin-top:10px}
.pay-hero p{margin:0;color:var(--label-2)}
.pay-list{list-style:none;padding:0;margin:0}
.pay-list li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;padding:12px 16px;font-size:16px}
.pay-list li+li{border-top:.5px solid var(--sep)}
.pay-list li::before{content:"✓";width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--on);background:var(--accent)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{position:relative;text-align:left;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:2px;background:var(--grouped);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.plan.selected{box-shadow:inset 0 0 0 2px var(--accent)}
.plan .pn{font-size:13px;font-weight:600;color:var(--label-2)}
.plan-price{font-family:var(--round);font-size:26px;font-weight:800}
.plan-price small{font-family:var(--font);font-size:13px;font-weight:500;color:var(--label-2)}
.plan-note{font-size:13px;color:var(--label-2)}

.fine{font-size:13px;color:var(--label-2);text-align:center;margin:0}
.fine.dim{color:var(--label-3)}

/* Feedback: island toasts */
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding-inline:16px}
.toast{background:#000;color:#fff;padding:11px 20px;border-radius:99px;font-size:15px;font-weight:600;animation:island .55s var(--spring);box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 16px 36px -14px #000}
.toast.gold{color:var(--yellow)}
@keyframes island{from{transform:scale(.6,.4);opacity:0}}
.xp-float{position:fixed;z-index:70;font-family:var(--round);font-weight:800;font-size:16px;color:var(--accent);pointer-events:none;transform:translate(-50%,-50%);animation:floatup 1s var(--ease) forwards;white-space:nowrap}
@keyframes floatup{to{transform:translate(-50%,-180%);opacity:0}}
.conf{position:fixed;left:50%;top:38%;width:8px;height:8px;border-radius:2px;z-index:70;pointer-events:none;animation:conf 1.3s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* ---------- from the reels ---------- */
#plate:empty{display:none}
.plate{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:22px;align-items:center;padding:14px 20px;border-radius:22px;background:var(--plate-bg);box-shadow:inset 0 0 0 1.5px var(--plate-border),0 0 20px -8px var(--plate-glow)}

.kl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--label-2);white-space:nowrap}
.kv{display:block;font-family:var(--round);font-size:34px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}

.xb.wkb i{background:linear-gradient(90deg,var(--violet),var(--pink));box-shadow:0 0 8px rgba(236,72,153,.3)}
@media (max-width:540px){.plate{gap:12px;padding:12px 14px}.kv{font-size:26px}.kl{font-size:10px;letter-spacing:.05em}.kv.rk{font-size:13px}}
.activity.perfect{box-shadow:inset 0 0 0 1.5px rgba(255,209,102,.5),0 0 44px -16px rgba(255,209,102,.7)}
.trow.big.done{background:color-mix(in srgb,var(--c) 62%,var(--grouped))}
.trow.big.done input{color:#fff;text-decoration-color:rgba(255,255,255,.7)}
.trow.big.done .star{color:#fff}
.trow.big.done .cb.on{background:rgba(255,255,255,.94);color:var(--on);box-shadow:none}
.dhead::after{content:"";display:block;height:3px;border-radius:99px;background:var(--c);margin:12px 18px 0;box-shadow:0 0 12px -2px var(--c)}
.an .thin{height:8px}
.an .thin i{box-shadow:0 0 12px -3px var(--p)}
/* month board */
.board{padding:18px 0 20px 16px}
.board .grid-wrap{padding-right:16px}
.band{display:grid;grid-template-columns:repeat(var(--k),var(--cell));column-gap:4px;text-align:center;border-radius:12px 12px 4px 4px;background:var(--c);color:var(--on);padding:6px 0 4px;margin-bottom:8px;box-shadow:0 10px 26px -16px var(--c)}

.band span.bd{opacity:1;font-family:var(--round);font-size:11px;font-weight:800}
.band span.bd.now{background:var(--on);color:#fff;border-radius:99px;margin-inline:2px}
.mlab.top-l{height:auto;align-items:flex-end;padding-bottom:12px}

.mcell.tcol{background:color-mix(in srgb,var(--accent) 10%,transparent)}

.mcell.tcol.rl{border-radius:0 0 10px 10px}
.board .cb.on{box-shadow:0 0 12px -3px var(--c)}
.sc{height:36px;display:flex;align-items:flex-end}
.sc i{display:block;width:100%;height:22px;border-radius:6px;background:color-mix(in srgb,var(--accent) var(--a),var(--grouped-2))}
.sc i.future{background:var(--fill);opacity:.5}
.sc.pf i{box-shadow:0 0 12px -2px var(--accent)}
.wave{position:relative;height:120px;margin-top:18px}
.wave svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 35%,transparent))}

.pemo{display:grid;place-items:center;color:color-mix(in srgb,var(--c) 55%,#fff)}

.emo{display:grid;place-items:center;color:var(--label-2)}
.emo .ic{width:22px;height:22px}
.emo.sel{color:var(--accent)}
.preset>span{display:grid;place-items:center;color:var(--accent)}
.preset .ic{width:20px;height:20px}
/* smooth: one sliding highlight per segmented control and in the tab bar */
.segc.slid{position:relative}
.segc.slid::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px - (var(--n) - 1) * 2px) / var(--n));border-radius:8px;background:var(--seg-sel);box-shadow:0 3px 8px rgba(0,0,0,.2);transform:translateX(calc(var(--i) * (100% + 2px)));transition:transform .38s cubic-bezier(.3,1.25,.5,1)}
.segc.slid button{position:relative;z-index:1;transition:color .25s}
.segc.slid button.sel{background:transparent;box-shadow:none}
.tabbar.slid::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px - (var(--n) - 1) * 2px) / var(--n));border-radius:26px;background:rgba(255,255,255,.1);box-shadow:inset 0 .5px 0 rgba(255,255,255,.18);transform:translateX(calc(var(--i) * (100% + 2px)));transition:transform .42s cubic-bezier(.3,1.25,.5,1)}
.tabbar.slid .nav-item{position:relative;z-index:1}
.tabbar.slid .nav-item.active{background:transparent;box-shadow:none}
.nav-item svg{transition:transform .3s var(--spring)}
.nav-item.active svg{transform:translateY(-1px) scale(1.08)}
/* a new tab slides in from its side; switched content fades up */
#view.v-l{animation:viewL .34s var(--ease)}
#view.v-r{animation:viewR .34s var(--ease)}
@keyframes viewL{from{opacity:0;transform:translateX(22px)}}
@keyframes viewR{from{opacity:0;transform:translateX(-22px)}}
.seg-in{animation:segIn .32s var(--ease)}
@keyframes segIn{from{opacity:0;transform:translateY(8px)}}
/* sheets: the backdrop fades, closing slides down */
.sheet-backdrop{animation:fadein .3s var(--ease)}
.sheet-wrap.closing .sheet{animation:sheetDown .23s cubic-bezier(.4,0,1,1) forwards}
.sheet-wrap.closing .sheet-backdrop{animation:fadeOut .23s forwards}
@keyframes sheetDown{to{transform:translateY(60px);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
/* small things that move */
.btn,.btn-tint,.btn-keep,.pillbtn,.catb,.nchip,.dchip,.preset,.emo,.sw{transition:transform .18s var(--spring),background .2s,box-shadow .2s,color .2s}
.btn:active,.btn-tint:active,.pillbtn:active,.catb:active,.nchip:active,.dchip:active,.preset:active,.emo:active{transform:scale(.95)}
.gl-bar i,.thin i,.xb i,.ld-track i{transition:width .7s var(--ease)}
.li,.gl,.lb-row,.th-row{transition:background .2s}
/* week on a computer: four days on top, three below, never seven narrow ones */
@media (min-width:1640px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.rail-theme-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;margin-bottom:8px;border-radius:14px;background:var(--fill);color:var(--label);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,opacity .2s;text-align:left}
.rail-theme-btn:hover{opacity:.85}

/* Auth & Account Switcher */
.auth-sheet .inp{border:1px solid var(--sep);border-radius:14px;padding:12px 14px;font-size:16px;background:var(--grouped);color:var(--label);margin-bottom:12px}
.auth-sheet .inp:focus{border-color:var(--accent)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--fill);margin-bottom:16px}
.auth-tab{padding:8px;text-align:center;font-weight:600;font-size:14px;border-radius:10px;color:var(--label-2);transition:all .2s}
.auth-tab.active{background:var(--grouped);color:var(--label);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.acct-list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--fill);margin-bottom:8px;font-size:14px}
.acct-list-item b{color:var(--label)}
.acct-cur{font-size:12px;color:var(--accent);font-weight:700}
.btn-oauth{display:flex;align-items:center;justify-content:center;width:100%;padding:11px 16px;background:var(--grouped);color:var(--label);border:1px solid var(--sep);border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .2s;text-decoration:none}
.btn-oauth:hover{background:var(--fill)}
.auth-divider{display:flex;align-items:center;text-align:center;margin:14px 0 10px;color:var(--label-3);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;border-bottom:1px solid var(--sep)}
.auth-divider::before{margin-right:10px}
.auth-divider::after{margin-left:10px}
.auth-link{color:var(--accent);font-size:13px;text-align:center;display:block;cursor:pointer;margin-top:12px;text-decoration:none}
.auth-link:hover{text-decoration:underline}

.about-sheet{max-width:580px;margin:0 auto;padding-bottom:24px}
.about-hero{text-align:center;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center}

.about-link-row{text-decoration:none;color:inherit;transition:background .15s}
.about-link-row:hover{background:var(--fill)}
.about-item-left{display:flex;align-items:center;gap:12px}
.about-ico{font-size:22px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--fill)}
.about-item-sub{font-size:12px;color:var(--label-3);margin-top:1px;font-weight:400}
.about-badge-status{font-size:12px;font-weight:700;color:var(--accent)}

.about-feat-card{background:var(--fill);border:1px solid var(--sep);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}

/* ---------- schedules ----------
   sched: {t:'daily'} | {t:'days', d:[weekday indexes, Mon = 0]} | {t:'every', n:2..7, from:'YYYY-MM-DD'} */
const DOW = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const dow = d => (d.getDay()+6)%7;
const dayDiff = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
function isDue(h, k){
  const s = h.sched || {t:'daily'};
  if (s.t === 'days') return s.d.includes(dow(parse(k)));
  if (s.t === 'every') { const n = dayDiff(s.from || h.since || k, k); return n >= 0 && n % s.n === 0; }
  return true;
}
function schedText(h){
  const s = h.sched || {t:'daily'};
  if (s.t === 'days') {
    if (s.d.length === 7) return 'Every day';
    if (s.d.length === 5 && !s.d.includes(5) && !s.d.includes(6)) return 'Weekdays';
    return s.d.slice().sort().map(i => DOW[i].slice(0,3)).join(' · ');
  }
  if (s.t === 'every') return 'Every '+s.n+' days';
  return 'Every day';
}
function nextDue(h, k){ let d = parse(k); for (let i = 1; i <= 14; i++) { d = addDays(d,1); if (isDue(h, key(d))) return d; } return null; }

const ratioOn = k => { const a = dueOn(k).length; return a ? doneDueOn(k).length / a : null; };
const r0 = k => ratioOn(k) || 0;
const isPerfect = k => { const a = dueOn(k).length; return a > 0 && doneDueOn(k).length === a; };
const counts = k => { const r = ratioOn(k); return r === null ? null : r >= .8; };
/* run of days back from today. test: true counts, false breaks, null (rest day) is skipped; an unfinished today never breaks */
function runFrom(test){ const t = today0(); let n = 0; for (let i = 0; i < 3650; i++) { const v = test(key(addDays(t,-i))); if (v === null) continue; if (!v) { if (i === 0) continue; break; } n++; } return n; }

function bestRunTest(keys, test){ let best = 0, run = 0; keys.slice().sort().forEach(k => { const v = test(k); if (v === null) return; run = v ? run + 1 : 0; best = Math.max(best, run); }); return best; }

/* Apple-Fitness-style concentric rings, outer first */
function rings(list, size){

function smoothPath(pts, top, bot){
  const cl = y => Math.min(bot, Math.max(top, y));
  let d = 'M' + f1(pts[0][0]) + ' ' + f1(pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1, i+2)];
    d += ' C' + f1(p1[0] + (p2[0]-p0[0])/6) + ' ' + f1(cl(p1[1] + (p2[1]-p0[1])/6)) + ' ' + f1(p2[0] - (p3[0]-p1[0])/6) + ' ' + f1(cl(p2[1] - (p3[1]-p1[1])/6)) + ' ' + f1(p2[0]) + ' ' + f1(p2[1]);
  }

}
/* lines: [{vals:[number|null], stroke, area, end, w}] */
function lineChart(lines, n, lo, hi, ticksY, fmtY, aria){
  const W = 640, H = 200, L = 36, R = 10, top = 12, bot = H - 26;
  const x = i => L + i * (W - L - R) / Math.max(1, n - 1), y = v => top + (1 - (v - lo) / (hi - lo)) * (bot - top);
  let g = ticksY.map(v => '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+f1(y(v))+'" y2="'+f1(y(v))+'" stroke="rgba(255,255,255,.07)" '+(v===lo?'':'stroke-dasharray="2 6"')+'/><text x="'+(L-8)+'" y="'+f1(y(v)+3)+'" text-anchor="end">'+fmtY(v)+'</text>').join('');
  for (let d = 5; d <= n; d += 5) g += '<text x="'+f1(x(d-1))+'" y="'+(H-6)+'" text-anchor="middle">'+d+'</text>';
  const paths = lines.map(ln => {
    let out = '', run = [];
    const flush = () => {
      if (run.length > 1) {
        const p = smoothPath(run, top, bot);
        if (ln.area) out += '<path d="'+p+' L'+f1(run[run.length-1][0])+' '+bot+' L'+f1(run[0][0])+' '+bot+' Z" fill="url(#g-area)"/>';
        out += '<path d="'+p+'" fill="none" stroke="'+ln.stroke+'" stroke-width="'+(ln.w||2.4)+'" stroke-linecap="round"/>';
        if (ln.end) { const e = run[run.length-1]; out += '<circle cx="'+f1(e[0])+'" cy="'+f1(e[1])+'" r="5" fill="#fff" stroke="#05070F" stroke-width="2"/>'; }
      } else if (run.length === 1) out += '<circle cx="'+f1(run[0][0])+'" cy="'+f1(run[0][1])+'" r="3" fill="'+ln.stroke+'"/>';
      run = [];
    };
    ln.vals.forEach((v,i) => { if (v == null) flush(); else run.push([x(i), y(v)]); });
    flush(); return out;
  }).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria)+'">'+g+paths+'</svg>';
}

function waveSvg(px, lines, n, h, area){

    + '<clipPath id="'+px+'-clip"><rect class="reveal" x="0" y="-20" width="'+W+'" height="'+(h+40)+'"/></clipPath></defs>';
  let body = '', dots = '';

        if (area) body += '<path d="'+p+' L'+f1(run[run.length-1][0])+' '+bot+' L'+f1(run[0][0])+' '+bot+' Z" fill="url(#g-area)"/>';
        body += '<path d="'+p+'" fill="none" stroke="'+(ln.stroke === 'weeks' ? 'url(#'+px+'-gw)' : ln.stroke)+'" stroke-width="'+(ln.w || 2.6)+'" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
      }

    if (ln.end) { let li = -1; ln.vals.forEach((v,i) => { if (v != null) li = i; }); if (li >= 0) dots += '<span class="wdot" style="left:'+((li*10 + 5) / W * 100).toFixed(2)+'%;top:'+(y(ln.vals[li]) / h * 100).toFixed(2)+'%"></span>'; }
  });
  return '<svg viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+defs+'<g clip-path="url(#'+px+'-clip)">'+body+'</g></svg>'+dots;
}

async function handleAuthSubmit(e){
  if (e && e.preventDefault) e.preventDefault();
  const emailEl = document.getElementById('auth-email');
  const passEl = document.getElementById('auth-pass');
  const nameEl = document.getElementById('auth-name');

  const email = emailEl ? emailEl.value.trim().toLowerCase() : '';
  const pass = passEl ? passEl.value : '';
  const name = nameEl ? nameEl.value.trim() : '';

  if (!email || !pass) {
    toast('Please enter both email and password');
    if (!email && emailEl) emailEl.focus();
    else if (passEl) passEl.focus();
    return;
  }

  const submitBtn = document.getElementById('auth-submit-btn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Authenticating…'; }

  const endpoint = authMode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
  const r = await api('POST', endpoint, { email, password: pass, name });

  if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = (authMode === 'login' ? 'Log In to Board' : 'Create My Account'); }

  if (!r.ok) {
    toast(r.d && r.d.error ? r.d.error : 'Authentication failed. Please check credentials.');
    return;
  }

  const user = r.d.user;
  if (r.d.token) { try { localStorage.setItem('sb_auth_token', r.d.token); } catch(e){} }
  activeUser = user;
  setCurrentUser(user);

  // Sync state with database
  if (authMode === 'signup') {
    const existing = load();
    if (existing && existing.habits && existing.habits.length) {
      S = existing;
    } else {
      S = emptyState();
      S.habits = [
        {id:'h1'+Date.now().toString(36), name:'Wake up early', emoji:'⏰', color:'mint', since:key(today0()), sched:{t:'daily'}},
        {id:'h2'+Date.now().toString(36), name:'Read 10 pages', emoji:'📖', color:'blue', since:key(today0()), sched:{t:'daily'}}
      ];
    }
    save();
    await syncToCloud();
  } else {
    // Pull board from database
    const local = load();
    const st = await api('GET', '/api/state');
    if (st && st.ok && st.d && st.d.data && st.d.data.habits && st.d.data.habits.length) {
      const serverChecks = Object.keys(st.d.data.checks || {}).length;
      const localChecks = (local && local.checks ? Object.keys(local.checks).length : 0);
      const serverHabits = (st.d.data.habits || []).length;
      const localHabits = (local && local.habits ? local.habits.length : 0);

      // If local has more checks or habits than server, push local to server
      if (local && (localChecks > serverChecks || (localHabits > serverHabits && serverChecks === 0))) {
        S = local;
        REV = Math.max(REV, st.d.rev || 1);
        save();
        await syncToCloud();
      } else {
        adopt(st.d.data, st.d.rev || 1);
      }
    } else if (local && local.habits && local.habits.length) {
      S = local;
      save();
      await syncToCloud();
    } else if (st && st.ok && st.d && st.d.data) {
      adopt(st.d.data, st.d.rev || 1);
    } else {
      S = emptyState();
      save();
      await syncToCloud();
    }
  }

  closeSheet();
  render();
  toast('Signed in as ' + (user.name || user.email), 'gold');
}

function panBoard(animate){
  const gw = document.querySelector('.grid-wrap'); if (!gw) return;
  const max = gw.scrollWidth - gw.clientWidth; if (max < 80) { gw.scrollLeft = 0; return; }   // the whole month fits: never shift it
  const now = gw.querySelector('.bd.now'), base = gw.getBoundingClientRect().left - gw.scrollLeft, cs = getComputedStyle(gw), snap = cs.scrollSnapType !== 'none';
  const at = !now ? 0 : snap ? now.closest('.band').getBoundingClientRect().left - base - (parseFloat(cs.scrollPaddingLeft) || 0) : now.getBoundingClientRect().left - base - gw.clientWidth * .6;
  const target = Math.min(max, Math.max(0, at));
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!animate || still) { gw.scrollLeft = target; return; }
  gw.classList.add('panning'); gw.scrollLeft = 0; stopPan = false;
  setTimeout(() => {
    const t0 = performance.now(), dur = 2800;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2, g = document.querySelector('.grid-wrap'); if (!g) return; g.scrollLeft = target * e; if (p < 1 && !stopPan) requestAnimationFrame(step); else g.classList.remove('panning'); };
    requestAnimationFrame(step);
  }, 700);
}

    $('#fresh-count').textContent = freshPick.size + ' of ' + pickMax() + ' picked';
    $('#fresh-go').disabled = !freshPick.size;
  }
  else if (a === 'fresh-go') {
    const tk = key(today0()), stamp = Date.now().toString(36);
    S = {v:1, demo:false, pro: DEMO || !!(CLOUD && ME && ME.pro), checks:{}, mind:{}, weeks:{}, ui:{tab:'today'},
         habits:[...freshPick].map((i,j) => ({id:'h'+j+stamp, name:PRESETS[i][0], emoji:PRESETS[i][1], color:COLORS[j % 7], since:tk, sched: PRESETS[i][2] ? Object.assign({}, PRESETS[i][2], PRESETS[i][2].t === 'every' ? {from:tk} : {}) : {t:'daily'}}))};
    ui.monthOffset = 0; ui.weekOffset = 0;
    if (DEMO) { S.mine = true; S.trial = Date.now(); dtrack('demo_fresh', {n: S.habits.length}); }
    save(); closeSheet(); switchTab('today'); toast(DEMO ? 'Your board · Day 1. Let’s go' : 'Day 1, Level 1. Let’s go');
    if (DEMO) setTimeout(openKeepSheet, 1400);
  }
  else if (a === 'load-example') { S = demoState(); ui.monthOffset = 0; ui.weekOffset = 0; ringPrev = {}; save(); render(); toast('Example data loaded'); }
  else if (a === 'money-m') { ui.moneyOffset = Math.min(0, ui.moneyOffset + +t.dataset.d); ui.txAll = false; ringPrev = {}; for (const q in countPrev) if (q.startsWith('$:')) delete countPrev[q]; render(); }
  else if (a === 'tx-add') openTx(null);
  else if (a === 'tx-edit') openTx(t.dataset.id);
  else if (a === 'tx-cat') { readTx(); txDraft.c = t.dataset.c; $('#sheet-body .form').outerHTML = txForm(); }
  else if (a === 'tx-all') { ui.txAll = true; render(); }
  else if (a === 'tx-del') {
    if (!deleteArmed) { deleteArmed = true; t.textContent = 'Tap again to delete'; return; }
    const m = wallet(); m.tx = m.tx.filter(x => x.id !== txDraft.id);
    save(); closeSheet(); render(); toast('Expense deleted');
  }
  else if (a === 'nospend') {
    const m = wallet(), k = t.dataset.k, i = m.nospend.indexOf(k), rect = t.getBoundingClientRect(), before = totalXP();
    if (i >= 0) m.nospend.splice(i, 1); else m.nospend.push(k);
    save(); render(); afterXP(before, rect);
    if (i < 0) toast('No-spend day logged', 'gold');
  }
  else if (a === 'bill-tick' || a === 'save-tick') {
    const p = planFor(t.dataset.mk, true), rect = t.getBoundingClientRect(), before = totalXP();
    let on;
    if (a === 'save-tick') on = p.save.done = !p.save.done; else on = p.bills[+t.dataset.i].paid = !p.bills[+t.dataset.i].paid;
    save(); render(); afterXP(before, rect);
    if (on && a === 'save-tick') { toast('Savings moved · +' + XP.save + ' XP', 'gold'); confetti(); }
    else if (on && p.bills.every(b => b.paid)) toast('Every bill paid this month', 'gold');
  }
  else if (a === 'plan-edit') openPlan();
  else if (a === 'pl-add') {
    readPlan(); const L = t.dataset.list, list = planDraft[L];
    if (L === 'cats') { const used = list.map(c => c.c); list.push({id:'c' + Date.now().toString(36), n:'', e: MEMOJI[(list.length + 7) % MEMOJI.length], c: COLORS.find(c => !used.includes(c)) || COLORS[list.length % 7], a:0}); }
    else list.push(L === 'bills' ? {n:'', a:0, paid:false} : {n:'', a:0});
    redrawPlan();
    const ins = document.querySelectorAll('#plan-form [data-pl="'+L+'"][data-f="n"]'); if (ins.length) ins[ins.length - 1].focus();
  }
  else if (a === 'pl-del') { readPlan(); planDraft[t.dataset.list].splice(+t.dataset.i, 1); redrawPlan(); }
  else if (a === 'pl-emo') { readPlan(); const c = planDraft.cats[+t.dataset.i]; c.e = MEMOJI[(MEMOJI.indexOf(c.e) + 1) % MEMOJI.length]; redrawPlan(); }
  else if (a === 'close-sheet') closeSheet();
});

/* money forms: an expense, the month's plan */
document.addEventListener('input', e => { if (e.target.id === 'tx-amt') e.target.style.width = ((e.target.value.length || 1) + .6) + 'ch'; });   // the amount grows next to its $
document.addEventListener('submit', e => {
  const id = e.target.id; if (id !== 'tx-form' && id !== 'plan-form') return;
  e.preventDefault();
  const m = wallet();
  if (id === 'tx-form') {
    readTx(); const d = txDraft;
    if (!(d.a > 0)) { $('#tx-amt').focus(); toast('Type the amount first'); return; }
    const before = totalXP();
    if (d.id) Object.assign(m.tx.find(x => x.id === d.id), {a:d.a, c:d.c, n:d.n.trim(), k:d.k});
    else m.tx.push({id:'t' + Date.now().toString(36), k:d.k, a:d.a, c:d.c, n:d.n.trim()});
    m.nospend = m.nospend.filter(x => x !== d.k);   // a day with spending isn't a no-spend day
    planFor(mkOf(d.k), true);
    save(); closeSheet(); render(); afterXP(before, null);
    toast(d.id ? 'Saved' : 'Expense added · ' + usd2(d.a));
  } else {
    readPlan(); const d = planDraft, mk = d.mk; delete d.mk;
    ['income','bills','cats'].forEach(L => { d[L] = d[L].filter(x => String(x.n).trim() || x.a); d[L].forEach(x => { x.n = String(x.n).trim(); }); });
    m.plans[mk] = d;
    save(); closeSheet(); render(); toast('Plan saved');
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'habit-form') return;
  e.preventDefault();
  const name = $('#habit-name').value.trim();
  if (!name) { $('#habit-name').focus(); $('#habit-name').placeholder = 'Give it a name first'; return; }
  if (habitDraft.id) { const h = S.habits.find(x => x.id === habitDraft.id); Object.assign(h, {name, emoji:habitDraft.emoji, color:habitDraft.color, sched:habitDraft.sched}); }
  else S.habits.push({id:'h' + Date.now().toString(36), name, emoji:habitDraft.emoji, color:habitDraft.color, since:key(today0()), sched:habitDraft.sched});
  save(); closeSheet(); render(); if (fromHabits) openHabits(); toast(habitDraft.id ? 'Saved' : 'Habit added · +10 XP per check');
});

document.addEventListener('input', e => {
  const el = e.target, fld = el.dataset && el.dataset.field; if (!fld) return;
  const w = S.weeks[el.dataset.wk]; if (!w) return;
  if (fld === 'boss') w.boss.text = el.value;
  else if (fld === 'big3') w.days[el.dataset.dk].big3[+el.dataset.i].text = el.value;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && el.dataset.newtask) {
    e.preventDefault();
    const v = el.value.trim(); if (!v) return;
    S.weeks[el.dataset.wk].days[el.dataset.dk].tasks.push({text:v, done:false});
    const id = el.id; save(); render();
    const n = document.getElementById(id); if (n) n.focus();
  }
});


document.addEventListener('submit', e => {
  if (e.target.id === 'auth-form') handleAuthSubmit(e);
});



function checkOAuthHash(){
  try {
    const hash = window.location.hash;
    if (hash && (hash.includes('access_token=') || hash.includes('refresh_token='))) {
      const params = new URLSearchParams(hash.replace(/^#/, ''));
      const token = params.get('access_token');
      if (token) {
        localStorage.setItem('sb_auth_token', token);
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        return token;
      }
    }
  } catch(e){}
  return null;
}
checkOAuthHash();

async function checkServerSession(){
  try {
    const me = await api('GET', '/api/auth/me');
    if (me && me.ok && me.d && me.d.user) {
      activeUser = me.d.user;
      setCurrentUser(me.d.user);
      const local = load();
      const st = await api('GET', '/api/state');
      if (st && st.ok && st.d && st.d.data && st.d.data.habits && st.d.data.habits.length) {
        const serverChecks = Object.keys(st.d.data.checks || {}).length;
        const localChecks = (local && local.checks ? Object.keys(local.checks).length : 0);
        const serverHabits = (st.d.data.habits || []).length;
        const localHabits = (local && local.habits ? local.habits.length : 0);
        
        if (local && (localChecks > serverChecks || (localHabits > serverHabits && serverChecks === 0))) {
          S = local;
          REV = Math.max(REV, st.d.rev || 1);
          save();
          await syncToCloud();
        } else {
          adopt(st.d.data, st.d.rev || 1);
        }
      } else if (local && local.habits && local.habits.length) {
        S = local;
        save();
        await syncToCloud();
      } else if (st && st.ok && st.d && st.d.data) {
        adopt(st.d.data, st.d.rev || 1);
      }
      render();
    }
  } catch(e){
    console.error('Session check error:', e);
  }
}
checkServerSession();

window.addEventListener('beforeunload', () => {
  if (!activeUser || !cloudSyncPending) return;
  try {
    const token = localStorage.getItem('sb_auth_token');
    const payload = JSON.stringify({ data: stateOut(), rev: REV });
    fetch('/api/state', {
      method: 'PUT',
      keepalive: true,
      headers: {
        'content-type': 'application/json',
        ...(token ? { 'authorization': 'Bearer ' + token } : {})
      },
      body: payload
    }).catch(() => {});
  } catch(e){}
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (activeUser && cloudSyncPending) {
      syncToCloud();
    }
  } else if (document.visibilityState === 'visible') {
    if (activeUser && !isCloudSyncing && !cloudSyncPending) {
      checkCloudUpdate();
    }
  }
});

window.addEventListener('focus', () => {
  if (activeUser && !isCloudSyncing && !cloudSyncPending) {
    checkCloudUpdate();
  }
});

async function checkCloudUpdate(){
  if (!activeUser || isCloudSyncing || cloudSyncPending) return;
  const activeEl = document.activeElement;
  if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) return;
  try {
    const st = await api('GET', '/api/state');
    if (st && st.ok && st.d && st.d.data && st.d.rev && st.d.rev > REV) {
      adopt(st.d.data, st.d.rev);
      render();
    }
  } catch(e){}
}

if (EMBED) startEmbed(); else if (DEMO) startDemo(); else if (CLOUD) boot(); else render();
})();
